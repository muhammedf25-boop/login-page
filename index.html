<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOx Model</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Our Menu</h1>
    <div class="cards">
        <div class="card">
            <img src="domoda.webp" alt="domoda stew">
            <h2>Domoda</h2>
            <p>Groundnut stew meat and vegetables, and rice</p>
            <p>D 250</p>
            <button class="button">Order</button>
        </div>

        <div class="card">
            <img src="benachin.webp" alt="benachin one-pot">
            <h2>benachin</h2>
            <p>One pot rice cooked in tomato spice</p>
            <p>D 200</p>
            <button class="button">Order</button>
        </div>

        <div class="card">
            <img src="chicken yassa.jfif" alt="chicken with onion sause">
            <h2>chicken Yassa</h2>
            <p>Chicken in lemon and onion sause, with rice</p>
            <p>D 300</p>
            <button class="button">Order</button>
        </div>
    </div>
</body>

</html>
